[versions]
mindustry = "v160.7"
# 2.51.0 removed AbstractAsKeyOfSetOrMap, which the palantir checks still extend
errorprone = "2.50.0"
junit = "6.1.3"

[libraries]
mindustry-core = { module = "com.github.Anuken.Mindustry:core", version.ref = "mindustry" }
mindustry-server = { module = "com.github.Anuken.Mindustry:server", version.ref = "mindustry" }
arc-core = { module = "com.github.Anuken.Arc:arc-core", version.ref = "mindustry" }
mindustry-release-server = { module = "Anuken:server-release", version.ref = "mindustry" }
mindustry-release-client = { module = "Anuken:Mindustry", version.ref = "mindustry" }

jspecify = "org.jspecify:jspecify:1.0.1"
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = "com.uber.nullaway:nullaway:0.14.3"
errorprone-palantir = "com.palantir.baseline-error-prone:baseline-error-prone:0.32.0"
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = "org.assertj:assertj-core:3.27.7"

postgresql = "org.postgresql:postgresql:42.7.14"
postgresql-embedded = "io.zonky.test:embedded-postgres:2.2.2"

[plugins]
spotless = "com.diffplug.spotless:8.10.4"
shadow = "com.gradleup.shadow:9.6.1"
errorprone = "net.ltgt.errorprone:5.1.1"
