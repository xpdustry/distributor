changelog:
  categories:
    - title: "⚠️ Breaking Changes"
      labels: [ breaking ]
    - title: "Changes & New Features"
      labels: [ feature ]
      exclude:
        labels: [ breaking ]
    - title: "Bugfixes"
      labels: [ fix ]
      exclude:
        labels: [ breaking ]
    - title: "Dependencies"
      labels: [ dependencies ]
      exclude:
        labels: [ breaking ]
    - title: "Maintenance"
      labels: [ maintenance ]
      exclude:
        labels: [ breaking, dependencies ]
    - title: "Other Changes"
      labels: [ "*" ]
