name: "Publish Test Results"

on:
  workflow_run:
    workflows: [ "Build" ]
    types:
      - completed

jobs:
  action:
    name: "Action"
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      checks: write
      pull-requests: write # needed unless run with comment_mode: off
      contents: read # only needed for private repository
      issues: read # only needed for private repository
      actions: read # required by download step to access artifacts API
    steps:

      - name: "Download and Extract Test Results"
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts
          name: test-results|event-file
          name_is_regexp: true

      - name: "Publish Test Results"
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"
